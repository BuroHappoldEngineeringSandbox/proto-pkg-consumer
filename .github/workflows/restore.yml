name: restore
on:
  workflow_dispatch:
    inputs:
      credential:
        description: github_token or app
        required: true
        default: github_token
        type: choice
        options: [github_token, app]
      project:
        description: consumer project to restore
        required: true
        default: src/Proto.Consumer.csproj
        type: choice
        options: [src/Proto.Consumer.csproj, src-public/Proto.Consumer.Public.csproj]
permissions:
  contents: read
  packages: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - id: app
        if: inputs.credential == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROTO_PKG_READER_APP_ID }}
          private-key: ${{ secrets.PROTO_PKG_READER_PRIVATE_KEY }}
      - run: dotnet restore "$PROJECT" --configfile nuget.config -v normal --no-cache --force
        env:
          PROJECT: ${{ inputs.project }}
          PROTO_FEED_TOKEN: ${{ inputs.credential == 'app' && steps.app.outputs.token || secrets.GITHUB_TOKEN }}
